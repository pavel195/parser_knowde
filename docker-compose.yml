version: '3.8'

services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - KNOWDE_EMAIL=${KNOWDE_EMAIL}
      - KNOWDE_PASSWORD=${KNOWDE_PASSWORD}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CHROME_HEADLESS=1
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 5G
    security_opt:
      - seccomp=unconfined
    shm_size: '4gb'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    command: python scripts/pipeline.py

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    command: uvicorn src.api.api:app --host 0.0.0.0 --port 8000 --reload 