version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=knowde_parser
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - KNOWDE_EMAIL=${KNOWDE_EMAIL}
      - KNOWDE_PASSWORD=${KNOWDE_PASSWORD}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CHROME_HEADLESS=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=knowde_parser
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 5G
    security_opt:
      - seccomp=unconfined
    shm_size: '4gb'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    command: >
      bash -c "
      mkdir -p /app/data/brand_data /app/data/products /app/data/pipeline /app/data/logs &&
      chmod -R 777 /app/data &&
      python scripts/pipeline.py"

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=knowde_parser
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    command: uvicorn src.api.api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local 